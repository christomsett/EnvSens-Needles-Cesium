<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Point Cloud Viewer</title>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />

  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* ---------------------------------------------------------------
       Gradient background
       --------------------------------------------------------------- */

    #cesiumContainer {
      background: linear-gradient(
        to bottom,
        #e2d8c8 0%,
        #747762 50%,
        #3c3c3b 100%
      );
    }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>

  <script>

    // ------------------------------------------------------------------
    // Cesium ion access token for the IoW Needles Dataset
    // ------------------------------------------------------------------

    Cesium.Ion.defaultAccessToken =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IjdkVVpaNDQ1NWpkVXBndUUiLCJqdGkiOiI2N2Q0NTM2NC01NjczLTQxMTQtODc1Yy1hN2FjMTNhZDM1M2QiLCJpZCI6NDgwNjc5LCJzdWIiOiJlc2FzX3NvdG9uIiwiaXNzIjoiaHR0cHM6Ly9hcGkuY2VzaXVtLmNvbSIsImF1ZCI6Ik5lZWRsZXMtSW9XIiwiaWF0IjoxNzg4NTMwNzI2fQ.O0bjJp3gUqj2a0ZQRI9BIWdnMe_RvkmQUegTU2k4D6Q';


    // ------------------------------------------------------------------
    // Point cloud asset
    // ------------------------------------------------------------------

    const POINT_CLOUD_ASSET_ID = 5184080;


    // ------------------------------------------------------------------
    // Create viewer
    // ------------------------------------------------------------------

    const viewer = new Cesium.Viewer('cesiumContainer', {

      timeline: false,
      animation: false,

      // Don't load Cesium's default base imagery
      baseLayer: false,

      // Don't load terrain
      terrain: undefined,

      // Cleaner interface
      sceneModePicker: false,
      navigationHelpButton: false,

      // Keep the normal Cesium attribution
      creditContainer: document.createElement('div'),

      // --------------------------------------------------------------
      // NEW: Allow the Cesium WebGL canvas to be transparent
      // --------------------------------------------------------------
      contextOptions: {
        webgl: {
          alpha: true
        }
      }

    });


    // ------------------------------------------------------------------
    // Remove Cesium globe / mapping / atmosphere
    // ------------------------------------------------------------------

    // No globe behind the point cloud
    viewer.scene.globe.show = false;

    // No atmospheric haze
    viewer.scene.skyAtmosphere.show = false;

    // No Cesium sky box
    viewer.scene.skyBox.show = false;


    // ------------------------------------------------------------------
    // NEW: Make the Cesium scene transparent
    // ------------------------------------------------------------------

    viewer.scene.backgroundColor =
      new Cesium.Color(
        0.0,
        0.0,
        0.0,
        0.0
      );


    // ------------------------------------------------------------------
    // Antialiasing
    // ------------------------------------------------------------------

    viewer.scene.postProcessStages.fxaa.enabled = true;


    // ------------------------------------------------------------------
    // Load point cloud
    // ------------------------------------------------------------------

    async function loadPointCloud() {

      try {

        const tileset =
          await Cesium.Cesium3DTileset.fromIonAssetId(
            POINT_CLOUD_ASSET_ID
          );

        viewer.scene.primitives.add(tileset);


        // --------------------------------------------------------------
        // Point-cloud rendering
        // --------------------------------------------------------------

        // Enable distance-based point attenuation
        tileset.pointCloudShading.attenuation = true;

        // Maximum rendered point size
        tileset.pointCloudShading.maximumAttenuation = 2;

        // Estimate of point spacing in metres
        tileset.pointCloudShading.baseResolution = 0.1;
		
		// Aims to alter spacing in point cloud at distance (i.e. point density)
		tileset.maximumScreenSpaceError = 2;


        // --------------------------------------------------------------
        // Frame point cloud
        // --------------------------------------------------------------

        await viewer.zoomTo(tileset);

      }

      catch (error) {

        console.error(
          'Error loading point cloud tileset:',
          error
        );

      }

    }


    // ------------------------------------------------------------------
    // Start
    // ------------------------------------------------------------------

    loadPointCloud();

  </script>
</body>
</html>
