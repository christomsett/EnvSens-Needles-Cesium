<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Point Cloud Viewer</title>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />

  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* ---------------------------------------------------------------
       Gradient background
       --------------------------------------------------------------- */

    #cesiumContainer {
      background: linear-gradient(
        to bottom,
        #e2d8c8 0%,
        #747762 50%,
        #3c3c3b 100%
      );
    }

    /* ---------------------------------------------------------------
       Custom zoom controls
       --------------------------------------------------------------- */

    #zoomControls {
      position: absolute;
      right: 15px;
      bottom: 15px;
      z-index: 1000;

      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    #zoomControls button {
      width: 36px;
      height: 36px;

      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 4px;

      background: rgba(40, 40, 40, 0.75);
      color: white;

      font-family: Arial, sans-serif;
      font-size: 22px;
      line-height: 36px;

      padding: 0;
      cursor: pointer;

      box-sizing: border-box;
    }

    #zoomControls button:hover {
      background: rgba(70, 70, 70, 0.9);
    }

    #zoomControls button:active {
      background: rgba(20, 20, 20, 0.95);
    }

    /* Smaller text for the home button */

    #zoomHome {
      font-size: 16px !important;
      margin-bottom: 4px;
    }

  </style>
</head>

<body>
  <div id="cesiumContainer"></div>

  <!-- ---------------------------------------------------------------
       Custom zoom controls
       --------------------------------------------------------------- -->

  <div id="zoomControls">

    <!-- Zoom to entire dataset -->
    <button id="zoomHome" title="Zoom to dataset">⌂</button>

    <!-- Zoom in -->
    <button id="zoomIn" title="Zoom in">+</button>

    <!-- Zoom out -->
    <button id="zoomOut" title="Zoom out">−</button>

  </div>


  <script>

    // ------------------------------------------------------------------
    // Cesium ion access token for the IoW Needles Dataset
    // ------------------------------------------------------------------

    Cesium.Ion.defaultAccessToken =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IkdZNVdUcG5EbnA4ZWJpNW4iLCJqdGkiOiI0NmQyZTg5Yy1kNjM5LTQ3MTUtYjdhNy00ZTIyMTEzYjJmNjMiLCJpZCI6NDgwNjc5LCJzdWIiOiJlc2FzX3NvdG9uIiwiaXNzIjoiaHR0cHM6Ly9hcGkuY2VzaXVtLmNvbSIsImF1ZCI6IklvVyBOZWVkbGVzIiwiaWF0IjoxNzg4NTMzNjAzfQ.ub-XcuxDNDtSk7qr9UIqv4zT_LsZyA8-KTftO3tOUx8';


    // ------------------------------------------------------------------
    // Point cloud asset
    // ------------------------------------------------------------------

    const POINT_CLOUD_ASSET_ID = 5184080;


    // ------------------------------------------------------------------
    // Create viewer
    // ------------------------------------------------------------------

    const viewer = new Cesium.Viewer('cesiumContainer', {

      // --------------------------------------------------------------
      // Remove standard Cesium UI
      // --------------------------------------------------------------
    
      timeline: false,
      animation: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      baseLayerPicker: false,
      fullscreenButton: false,
      vrButton: false,
      infoBox: false,
      selectionIndicator: false,
    
      // --------------------------------------------------------------
      // No imagery or terrain
      // --------------------------------------------------------------
    
      baseLayer: false,
      terrain: undefined,
    
      // --------------------------------------------------------------
      // Keep the normal Cesium attribution
      // --------------------------------------------------------------
    
      creditContainer: document.createElement('div'),
    
      // --------------------------------------------------------------
      // Allow Cesium WebGL canvas to be transparent
      // --------------------------------------------------------------
    
      contextOptions: {
        webgl: {
          alpha: true
        }
      }
    
    });


    // ------------------------------------------------------------------
    // Remove Cesium globe / mapping / atmosphere
    // ------------------------------------------------------------------

    viewer.scene.globe.show = false;

    viewer.scene.skyAtmosphere.show = false;

    viewer.scene.skyBox.show = false;


    // ------------------------------------------------------------------
    // Make the Cesium scene transparent
    // ------------------------------------------------------------------

    viewer.scene.backgroundColor =
      new Cesium.Color(
        0.0,
        0.0,
        0.0,
        0.0
      );


    // ------------------------------------------------------------------
    // Antialiasing
    // ------------------------------------------------------------------

    viewer.scene.postProcessStages.fxaa.enabled = true;


    // ------------------------------------------------------------------
    // Load point cloud
    // ------------------------------------------------------------------

    async function loadPointCloud() {

      try {

        const tileset =
          await Cesium.Cesium3DTileset.fromIonAssetId(
            POINT_CLOUD_ASSET_ID
          );

        viewer.scene.primitives.add(tileset);


        // --------------------------------------------------------------
        // Point-cloud rendering
        // --------------------------------------------------------------

        // Enable distance-based point attenuation
        tileset.pointCloudShading.attenuation = true;

        // Maximum rendered point size
        tileset.pointCloudShading.maximumAttenuation = 2;

        // Estimate of point spacing in metres
        tileset.pointCloudShading.baseResolution = 0.1;

        // Load/refine more detailed tiles at distance
        tileset.maximumScreenSpaceError = 2;


        // --------------------------------------------------------------
        // Frame point cloud initially
        // --------------------------------------------------------------

        await viewer.zoomTo(tileset);


        // --------------------------------------------------------------
        // Custom zoom controls
        // --------------------------------------------------------------

        // Zoom to entire dataset
        document
          .getElementById('zoomHome')
          .addEventListener('click', function () {

            viewer.zoomTo(tileset);

          });


        // Zoom in
        document
          .getElementById('zoomIn')
          .addEventListener('click', function () {

            const height =
              viewer.camera.positionCartographic.height;

            viewer.camera.zoomIn(height * 0.30);

          });


        // Zoom out
        document
          .getElementById('zoomOut')
          .addEventListener('click', function () {

            const height =
              viewer.camera.positionCartographic.height;

            viewer.camera.zoomOut(height * 0.30);

          });

      }

      catch (error) {

        console.error(
          'Error loading point cloud tileset:',
          error
        );

      }

    }


    // ------------------------------------------------------------------
    // Start
    // ------------------------------------------------------------------

    loadPointCloud();

  </script>
</body>
</html>
