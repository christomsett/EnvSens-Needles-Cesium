<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Point Cloud Viewer</title>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>

  <link
    href="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Widgets/widgets.css"
    rel="stylesheet"
  />

  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #cesiumContainer {
      background: linear-gradient(
        to bottom,
        #e2d8c8 0%,
        #747762 50%,
        #3c3c3b 100%
      );
    }

    #zoomControls {
      position: absolute;
      right: 15px;
      bottom: 15px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    #zoomControls button {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 4px;
      background: rgba(40, 40, 40, 0.75);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 22px;
      line-height: 36px;
      padding: 0;
      cursor: pointer;
      box-sizing: border-box;
    }

    #zoomControls button:hover {
      background: rgba(70, 70, 70, 0.9);
    }

    #zoomControls button:active {
      background: rgba(20, 20, 20, 0.95);
    }

    #zoomHome {
      font-size: 16px !important;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>

  <div id="cesiumContainer"></div>

  <div id="zoomControls">
    <button id="zoomHome" title="Zoom to dataset">⌂</button>
    <button id="zoomIn" title="Zoom in">+</button>
    <button id="zoomOut" title="Zoom out">−</button>
  </div>

  <script>

    // ============================================================
    // CESIUM ION
    // ============================================================

    Cesium.Ion.defaultAccessToken =
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IjBQN29wN28zbzlLTGJoOEMiLCJqdGkiOiI0NmQyZTg5Yy1kNjM5LTQ3MTUtYjdhNy00ZTIyMTEzYjJmNjMiLCJpZCI6NDgwNjc5LCJzdWIiOiJlc2FzX3NvdG9uIiwiaXNzIjoiaHR0cHM6Ly9hcGkuY2VzaXVtLmNvbSIsImF1ZCI6IklvVyBOZWVkbGVzIiwiaWF0IjoxNzg4NTMzODQ3fQ.MdmElXor3JRkyDPzSGLUTnM3BGZkcJyUAr3bJJxZPlU';

    const POINT_CLOUD_ASSET_ID = 5184080;


    // ============================================================
    // GLOBAL POINT CLOUD VARIABLE
    // ============================================================

    let tileset;


    // ============================================================
    // CREATE VIEWER
    // ============================================================

    const viewer = new Cesium.Viewer('cesiumContainer', {

      timeline: false,
      animation: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      baseLayerPicker: false,
      fullscreenButton: false,
      vrButton: false,

      infoBox: true,

      // Disable Cesium's blue selection indicator
      selectionIndicator: false,

      baseLayer: false,
      terrain: undefined,

      creditContainer: document.createElement('div'),

      contextOptions: {
        webgl: {
          alpha: true
        }
      }
    });


    // ============================================================
    // SCENE APPEARANCE
    // ============================================================

    viewer.scene.globe.show = false;
    viewer.scene.skyAtmosphere.show = false;
    viewer.scene.skyBox.show = false;

    viewer.scene.backgroundColor =
      new Cesium.Color(
        0.0,
        0.0,
        0.0,
        0.0
      );

    viewer.scene.postProcessStages.fxaa.enabled = true;


    // ============================================================
    // LOAD POINT CLOUD
    // ============================================================

    async function loadPointCloud() {

      try {

        console.log("Loading point cloud...");

        tileset =
          await Cesium.Cesium3DTileset.fromIonAssetId(
            POINT_CLOUD_ASSET_ID
          );

        viewer.scene.primitives.add(tileset);


        // --------------------------------------------------------
        // Point cloud appearance
        // --------------------------------------------------------

        tileset.pointCloudShading.attenuation = true;

        tileset.pointCloudShading.maximumAttenuation = 2;

        tileset.pointCloudShading.baseResolution = 0.1;

        tileset.maximumScreenSpaceError = 2;


        console.log("Point cloud loaded.");


        // --------------------------------------------------------
        // Zoom to point cloud
        // --------------------------------------------------------

        await viewer.zoomTo(tileset);


        // --------------------------------------------------------
        // Home button
        // --------------------------------------------------------

        document
          .getElementById('zoomHome')
          .addEventListener('click', function () {

            viewer.zoomTo(tileset);

          });


        // --------------------------------------------------------
        // Zoom in
        // --------------------------------------------------------

        document
          .getElementById('zoomIn')
          .addEventListener('click', function () {

            const height =
              viewer.camera.positionCartographic.height;

            viewer.camera.zoomIn(height * 0.30);

          });


        // --------------------------------------------------------
        // Zoom out
        // --------------------------------------------------------

        document
          .getElementById('zoomOut')
          .addEventListener('click', function () {

            const height =
              viewer.camera.positionCartographic.height;

            viewer.camera.zoomOut(height * 0.30);

          });

      }

      catch (error) {

        console.error(
          "Error loading point cloud tileset:",
          error
        );

      }

    }


    // ============================================================
    // LOAD POINTS OF INTEREST
    // ============================================================

    async function loadPOI() {

      try {

        console.log("Loading POI.geojson...");


        // --------------------------------------------------------
        // Load GeoJSON
        //
        // IMPORTANT:
        // POI.geojson should be EPSG:4326 / WGS84.
        //
        // We deliberately DO NOT use clampToGround here.
        // --------------------------------------------------------

        const poiDataSource =
          await Cesium.GeoJsonDataSource.load(
            'POI.geojson',
            {
              clampToGround: false
            }
          );


        viewer.dataSources.add(poiDataSource);


        const entities =
          poiDataSource.entities.values;


        console.log(
          "POI loaded:",
          entities.length,
          "points"
        );


        // --------------------------------------------------------
        // Make sure the point cloud is available
        // --------------------------------------------------------

        if (!tileset) {

          console.warn(
            "Point cloud is not available yet."
          );

          return;

        }


        // --------------------------------------------------------
        // Wait for point cloud
        // --------------------------------------------------------

        await tileset.readyPromise;


        console.log(
          "Clamping POIs to point cloud..."
        );


        // --------------------------------------------------------
        // Get POI positions
        // --------------------------------------------------------

        const positions = [];
        const validEntities = [];


        for (const entity of entities) {

          const position =
            entity.position.getValue(
              Cesium.JulianDate.now()
            );


          if (Cesium.defined(position)) {

            positions.push(position);
            validEntities.push(entity);

          }

        }


        console.log(
          "Valid POI positions:",
          positions.length
        );


        // --------------------------------------------------------
        // Clamp to the 3D Tiles point cloud
        //
        // This is NOT terrain clamping.
        // --------------------------------------------------------

        const clampedPositions =
          await viewer.scene.clampToHeightMostDetailed(
            positions,
            [],
            0.5
          );


        // --------------------------------------------------------
        // Apply the clamped positions
        // --------------------------------------------------------

        for (
          let i = 0;
          i < validEntities.length;
          i++
        ) {

          const entity =
            validEntities[i];

          const clampedPosition =
            clampedPositions[i];


          if (
            !Cesium.defined(
              clampedPosition
            )
          ) {

            console.warn(
              "Could not clamp POI:",
              entity.name
            );

            continue;

          }


          // ------------------------------------------------------
          // Move POI onto LiDAR surface
          // ------------------------------------------------------

          entity.position =
            clampedPosition;


          // ------------------------------------------------------
          // Yellow POI marker
          //
          // IMPORTANT:
          //
          // No disableDepthTestDistance:
          // Number.POSITIVE_INFINITY
          //
          // Therefore the point can be hidden by
          // the point cloud.
          // ------------------------------------------------------

          entity.point =
            new Cesium.PointGraphics({

              pixelSize: 14,

              color:
                Cesium.Color.YELLOW,

              outlineColor:
                Cesium.Color.BLACK,

              outlineWidth: 2,

              // Enable normal depth testing
              disableDepthTestDistance: 0

            });


          // ------------------------------------------------------
          // Read attribute information
          // ------------------------------------------------------

          const category =
            entity.properties.Category.getValue();

          const description =
            entity.properties.Des.getValue();


          // ------------------------------------------------------
          // Entity name
          // ------------------------------------------------------

          entity.name = category;


          // ------------------------------------------------------
          // Information displayed when clicked
          // ------------------------------------------------------

          entity.description = `

            <div
              style="
                font-family: Arial, sans-serif;
                max-width: 350px;
              "
            >

              <h3
                style="
                  margin-top: 0;
                  margin-bottom: 10px;
                "
              >
                ${category}
              </h3>

              <p>
                ${description}
              </p>

            </div>

          `;

        }


        console.log(
          "POIs successfully clamped to point cloud."
        );

      }

      catch (error) {

        console.error(
          "Error loading/clamping POI.geojson:",
          error
        );

      }

    }


    // ============================================================
    // INITIALISE VIEWER
    // ============================================================

    async function initialiseViewer() {

      // Load point cloud first
      await loadPointCloud();

      // Then load POIs and clamp them to the point cloud
      await loadPOI();

    }


    // ============================================================
    // START
    // ============================================================

    initialiseViewer();

  </script>

</body>
</html>
