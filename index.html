<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Point Cloud Viewer</title>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />

  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* ---------------------------------------------------------------
       Gradient background
       --------------------------------------------------------------- */

    #cesiumContainer {
      background: linear-gradient(
        to bottom,
        #e2d8c8 0%,
        #747762 50%,
        #3c3c3b 100%
      );
    }

    /* ---------------------------------------------------------------
       Custom zoom controls
       --------------------------------------------------------------- */

    #zoomControls {
      position: absolute;
      right: 15px;
      bottom: 15px;
      z-index: 1000;

      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    #zoomControls button {
      width: 36px;
      height: 36px;

      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 4px;

      background: rgba(40, 40, 40, 0.75);
      color: white;

      font-family: Arial, sans-serif;
      font-size: 22px;
      line-height: 36px;

      padding: 0;
      cursor: pointer;

      box-sizing: border-box;
    }

    #zoomControls button:hover {
      background: rgba(70, 70, 70, 0.9);
    }

    #zoomControls button:active {
      background: rgba(20, 20, 20, 0.95);
    }

    /* Smaller text for the home button */

    #zoomHome {
      font-size: 16px !important;
      margin-bottom: 4px;
    }

  </style>
</head>

<body>
  <div id="cesiumContainer"></div>

  <!-- ---------------------------------------------------------------
       Custom zoom controls
       --------------------------------------------------------------- -->

  <div id="zoomControls">

    <!-- Zoom to entire dataset -->
    <button id="zoomHome" title="Zoom to dataset">⌂</button>

    <!-- Zoom in -->
    <button id="zoomIn" title="Zoom in">+</button>

    <!-- Zoom out -->
    <button id="zoomOut" title="Zoom out">−</button>

  </div>


  <script>

  // ------------------------------------------------------------------
  // Cesium ion access token
  // ------------------------------------------------------------------

  Cesium.Ion.defaultAccessToken =
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IjBQN29wN28zbzlLTGJoOEMiLCJqdGkiOiI0NmQyZTg5Yy1kNjM5LTQ3MTUtYjdhNy00ZTIyMTEzYjJmNjMiLCJpZCI6NDgwNjc5LCJzdWIiOiJlc2FzX3NvdG9uIiwiaXNzIjoiaHR0cHM6Ly9hcGkuY2VzaXVtLmNvbSIsImF1ZCI6IklvVyBOZWVkbGVzIiwiaWF0IjoxNzg4NTMzODQ3fQ.MdmElXor3JRkyDPzSGLUTnM3BGZkcJyUAr3bJJxZPlU';


  // ------------------------------------------------------------------
  // Point cloud asset
  // ------------------------------------------------------------------

  const POINT_CLOUD_ASSET_ID = 5184080;


  // ------------------------------------------------------------------
  // Create viewer
  // ------------------------------------------------------------------

  const viewer = new Cesium.Viewer('cesiumContainer', {

    timeline: false,
    animation: false,
    geocoder: false,
    homeButton: false,
    sceneModePicker: false,
    navigationHelpButton: false,
    baseLayerPicker: false,
    fullscreenButton: false,
    vrButton: false,

    // Enable InfoBox so POIs can display information
    infoBox: true,

    selectionIndicator: false,

    baseLayer: false,
    terrain: undefined,

    creditContainer: document.createElement('div'),

    contextOptions: {
      webgl: {
        alpha: true
      }
    }

  });


  // ------------------------------------------------------------------
  // Remove Cesium globe / atmosphere
  // ------------------------------------------------------------------

  viewer.scene.globe.show = false;

  viewer.scene.skyAtmosphere.show = false;

  viewer.scene.skyBox.show = false;


  // ------------------------------------------------------------------
  // Transparent scene
  // ------------------------------------------------------------------

  viewer.scene.backgroundColor =
    new Cesium.Color(
      0.0,
      0.0,
      0.0,
      0.0
    );


  // ------------------------------------------------------------------
  // Antialiasing
  // ------------------------------------------------------------------

  viewer.scene.postProcessStages.fxaa.enabled = true;


  // ==================================================================
  // LOAD POINT CLOUD
  // ==================================================================

  async function loadPointCloud() {

    try {

      const tileset =
        await Cesium.Cesium3DTileset.fromIonAssetId(
          POINT_CLOUD_ASSET_ID
        );

      viewer.scene.primitives.add(tileset);


      // --------------------------------------------------------------
      // Point-cloud rendering
      // --------------------------------------------------------------

      tileset.pointCloudShading.attenuation = true;

      tileset.pointCloudShading.maximumAttenuation = 2;

      tileset.pointCloudShading.baseResolution = 0.1;

      tileset.maximumScreenSpaceError = 2;


      // --------------------------------------------------------------
      // Frame point cloud initially
      // --------------------------------------------------------------

      await viewer.zoomTo(tileset);


      // --------------------------------------------------------------
      // Custom zoom controls
      // --------------------------------------------------------------

      document
        .getElementById('zoomHome')
        .addEventListener('click', function () {

          viewer.zoomTo(tileset);

        });


      document
        .getElementById('zoomIn')
        .addEventListener('click', function () {

          const height =
            viewer.camera.positionCartographic.height;

          viewer.camera.zoomIn(height * 0.30);

        });


      document
        .getElementById('zoomOut')
        .addEventListener('click', function () {

          const height =
            viewer.camera.positionCartographic.height;

          viewer.camera.zoomOut(height * 0.30);

        });

    }

    catch (error) {

      console.error(
        'Error loading point cloud tileset:',
        error
      );

    }

  }


  // ==================================================================
  // LOAD POI
  // ==================================================================

  async function loadPOI() {

    try {

      console.log('Loading POI.geojson...');


      const poiDataSource =
        await Cesium.GeoJsonDataSource.load(
          'POI.geojson',
          {
            clampToGround: false
          }
        );


      viewer.dataSources.add(poiDataSource);


      console.log(
        'POI loaded:',
        poiDataSource.entities.values.length,
        'points'
      );


      // --------------------------------------------------------------
      // Style each POI
      // --------------------------------------------------------------

      for (const entity of poiDataSource.entities.values) {

        entity.point = new Cesium.PointGraphics({

          pixelSize: 14,

          color: Cesium.Color.YELLOW,

          outlineColor: Cesium.Color.BLACK,

          outlineWidth: 2,

          disableDepthTestDistance:
            Number.POSITIVE_INFINITY

        });


        // ------------------------------------------------------------
        // Get attribute values
        // ------------------------------------------------------------

        const category =
          entity.properties.Category.getValue();

        const description =
          entity.properties.Des.getValue();


        // ------------------------------------------------------------
        // Name shown at top of InfoBox
        // ------------------------------------------------------------

        entity.name = category;


        // ------------------------------------------------------------
        // Information shown when clicked
        // ------------------------------------------------------------

        entity.description = `
          <div style="font-family: Arial, sans-serif;">

            <h3>${category}</h3>

            <p>
              ${description}
            </p>

          </div>
        `;

      }

    }

    catch (error) {

      console.error(
        'Error loading POI.geojson:',
        error
      );

    }

  }


  // ==================================================================
  // START
  // ==================================================================

  loadPointCloud();

  loadPOI();

</script>
</body>
</html>
